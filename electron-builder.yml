appId: cnb.cool.waterpool
productName: Waterpool
copyright: Copyright © 2026 Mrzzz
directories:
  output: release
  buildResources: build
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
files:
  - electron/**/*
  - dist/**/*
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - portable
  artifactName: waterpool-${version}.${ext}
portable:
  artifactName: waterpool-${version}.${ext}
